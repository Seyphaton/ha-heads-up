    severity: *id006
    icon: *id007
    timeout: *id008
    actions: *id014
    tag: *id015
    tap_action: *id019
    image: *id023
    tts_message: *id020
    recipients: *id021
    audience: *id022
speak:
  fields:
    message: *id003
    id: *id004
    title: *id005
    severity: *id006
    icon: *id007
    timeout: *id008
    actions: *id014
    tag: *id015
    tap_action: *id019
    tts_message: *id020
    recipients: *id021
