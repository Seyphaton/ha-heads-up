create_banner:
  fields:
    message: &id003
      required: true
      example: The bedroom window is open.
      selector:
        text:
          multiline: true
    title: &id004
      example: Window open
      selector:
        text: null
    severity:
      default: warning
      selector:
        select:
          options:
          - success
          - info
          - warning
          - critical
          translation_key: severity
    icon: &id005
      selector:
        icon: null
    image: &id006
      example: /media/local/door.jpg
      selector:
        text: null
    audience:
      selector:
        entity:
          filter:
          - integration: heads_up
            domain: binary_sensor
    recipients:
      example: '["person.anna"]'
      selector:
        entity:
          domain: person
          multiple: true
    people:
      selector:
        entity:
          domain: person
          multiple: true
    id: &id007
      example: window_bedroom
      selector:
        text: null
    tag: &id008
      example: laundry
      selector:
        text: null
    timeout: &id009
      selector:
        duration:
          enable_day: true
    condition: &id011
      example: '{"entity_id": "binary_sensor.window", "state": "on", "for": {"minutes":
        5}}'
      selector:
        object: null
    mode: &id010
      selector:
        select:
          options:
          - once
          - recurring
          translation_key: mode
    tap_action: &id012
      example: '{"action": "navigate", "navigation_path": "/lovelace/0"}'
      selector:
        object: null
    actions: &id013
      example: '[{"key": "ack", "label": "Got it", "dismiss": true}]'
      selector:
        object: null
    dismissible:
      default: true
      selector:
        boolean: null
    dismiss_scope:
      selector:
        select:
          options:
          - user
          - global
          translation_key: dismiss_scope
    snoozable:
      selector:
        boolean: null
    snooze_scope:
      selector:
        select:
          options:
          - user
          - global
          translation_key: snooze_scope
    snooze_options: &id015
      example: '[{"minutes": 15}, {"hours": 1}, {"hours": 4}]'
      selector:
        object: null
clear_banner:
  fields:
    id: &id001
      example: window_bedroom
      selector:
        text: null
    tag: &id002
      example: laundry
      selector:
        text: null
clear_all: null
clear_notifications:
  fields:
    id: *id001
    tag: *id002
    severity:
      example: '["info", "success"]'
      selector:
        select:
          options:
          - success
          - info
          - warning
          - critical
          multiple: true
    channels:
      example: '["push"]'
      selector:
        select:
          options:
          - banner
          - push
          - popup
          - speak
          - persistent
          - mail
          multiple: true
    all:
      default: false
      selector:
        boolean: null
notify:
  fields:
    message: *id003
    title: *id004
    channels:
      required: true
      example: '["banner", "push"]'
      selector:
        select:
          options:
          - banner
          - push
          - popup
          - speak
          - persistent
          - mail
          multiple: true
          translation_key: channel
    match_policies_automatically:
      default: true
      selector:
        boolean: null
    dry_run:
      default: false
      selector:
        boolean: null
    policy:
      selector:
        entity:
          multiple: true
          filter:
          - integration: heads_up
            domain: switch
    audience:
      default: binary_sensor.heads_up_audience_everyone
      selector: &id017
        entity:
          filter:
          - integration: heads_up
            domain: binary_sensor
    recipients:
      example: '["person.anna"]'
      selector:
        entity:
          domain: person
          multiple: true
    speakers:
      example: '["media_player.kitchen"]'
      selector:
        entity:
          domain: media_player
          multiple: true
    tts_message: &id016
      example: The garage door is open.
      selector:
        text: {}
    severity:
      required: true
      selector:
        select:
          options:
          - success
          - info
          - warning
          - critical
          translation_key: severity
    icon: *id005
    image: *id006
    id: *id007
    tag: *id008
    timeout: *id009
    mode: *id010
    condition: *id011
    tap_action: *id012
    actions: *id013
    dismiss:
      example: user
      selector: &id014
        select:
          options:
          - 'off'
          - user
          - everyone
          translation_key: who_can
    snooze:
      example: user
      selector: *id014
    snooze_options: *id015
    mail_subject:
      example: '{person}'
      selector:
        text: {}
    mail_body:
      example: '{title}: {message}'
      selector:
        text:
          multiline: true
push:
  fields:
    message: *id003
    title: *id004
    severity:
      default: info
      selector:
        select:
          options:
          - success
          - info
          - warning
          - critical
          translation_key: severity
    icon: *id005
    image: *id006
    tts_message: *id016
    recipients:
      example: '["person.anna"]'
      selector:
        entity:
          domain: person
          multiple: true
    audience:
      example: binary_sensor.heads_up_audience_at_home
      selector: *id017
    id: *id007
    tag: *id008
    timeout: *id009
    tap_action: *id012
    actions: *id013
popup:
  fields:
    message: *id003
    title: *id004
    severity:
      default: info
      selector:
        select:
          options:
          - success
          - info
          - warning
          - critical
          translation_key: severity
    icon: *id005
    image: *id006
    tts_message: *id016
    recipients:
      example: '["person.anna"]'
      selector:
        entity:
          domain: person
          multiple: true
    audience:
      example: binary_sensor.heads_up_audience_at_home
      selector: *id017
    id: *id007
    tag: *id008
    timeout: *id009
    tap_action: *id012
    actions: *id013
speak:
  fields:
    message: *id003
    title: *id004
    severity:
      default: info
      selector:
        select:
          options:
          - success
          - info
          - warning
          - critical
          translation_key: severity
    icon: *id005
    tts_message: *id016
    recipients:
      example: '["media_player.kitchen"]'
      selector:
        entity:
          domain:
          - media_player
          - assist_satellite
          multiple: true
    id: *id007
    tag: *id008
    timeout: *id009
    tap_action: *id012
    actions: *id013
get_trace:
  fields:
    message_id:
      example: window_bedroom
      selector:
        text: null
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 1000
          mode: box
