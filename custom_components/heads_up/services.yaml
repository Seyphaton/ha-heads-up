create_banner:
  fields:
    message: &id003
      required: true
      example: The bedroom window is open.
      selector:
        text:
          multiline: true
    title: &id004
      example: Window open
      selector:
        text: null
    severity: &id005
      default: warning
      selector:
        select:
          options:
          - success
          - info
          - warning
          - critical
          translation_key: severity
    icon: &id006
      selector:
        icon: null
    image: &id007
      example: /media/local/door.jpg
      selector:
        text: null
    people:
      selector:
        entity:
          domain: person
          multiple: true
    id: &id008
      example: window_bedroom
      selector:
        text: null
    tag: &id009
      example: laundry
      selector:
        text: null
    timeout: &id010
      selector:
        duration:
          enable_day: true
    condition: &id011
      example: '{"entity_id": "binary_sensor.window", "state": "on", "for": {"minutes":
        5}}'
      selector:
        object: null
    wait_for_condition: &id012
      default: true
      selector:
        boolean: null
    mode: &id013
      selector:
        select:
          options:
          - once
          - recurring
          translation_key: mode
    tap_action: &id014
      example: '{"action": "navigate", "navigation_path": "/lovelace/0"}'
      selector:
        object: null
    actions: &id015
      example: '[{"key": "ack", "label": "Got it", "dismiss": true}]'
      selector:
        object: null
    dismissible:
      default: true
      selector:
        boolean: null
    dismiss_scope:
      selector:
        select:
          options:
          - user
          - global
          translation_key: dismiss_scope
    snoozable:
      selector:
        boolean: null
    snooze_scope:
      selector:
        select:
          options:
          - user
          - global
          translation_key: snooze_scope
    snooze_options: &id017
      example: '[{"minutes": 15}, {"hours": 1}, {"hours": 4}]'
      selector:
        object: null
clear_banner:
  fields:
    id: &id001
      example: window_bedroom
      selector:
        text: null
    tag: &id002
      example: laundry
      selector:
        text: null
clear_all: null
clear_notifications:
  fields:
    id: *id001
    tag: *id002
    severity:
      example: '["info", "success"]'
      selector:
        select:
          options:
          - success
          - info
          - warning
          - critical
          multiple: true
    channels:
      example: '["push"]'
      selector:
        select:
          options:
          - banner
          - push
          - popup
          - speak
          - persistent
          - mail
          multiple: true
    all:
      default: false
      selector:
        boolean: null
notify:
  fields:
    message: *id003
    title: *id004
    channels:
      required: true
      example: '["banner", "push"]'
      selector:
        select:
          options:
          - banner
          - push
          - popup
          - speak
          - persistent
          - mail
          multiple: true
          translation_key: channel
    policy:
      example: '["switch.heads_up_policy_quiet_hours"]'
      selector:
        entity:
          multiple: true
          filter:
          - integration: heads_up
            domain: switch
    no_policy:
      selector:
        boolean: null
    recipients:
      example: '["person.anna"]'
      selector:
        entity:
          domain: person
          multiple: true
    audience:
      example: binary_sensor.heads_up_audience_at_home
      selector: &id019
        entity:
          filter:
          - integration: heads_up
            domain: binary_sensor
    speakers:
      example: '["media_player.kitchen"]'
      selector:
        entity:
          domain: media_player
          multiple: true
    severity: *id005
    icon: *id006
    image: *id007
    tts_message: &id018
      example: The garage door is open.
      selector:
        text: {}
    id: *id008
    tag: *id009
    timeout: *id010
    condition: *id011
    wait_for_condition: *id012
    mode: *id013
    tap_action: *id014
    actions: *id015
    dismiss:
      example: user
      selector: &id016
        select:
          options:
          - 'off'
          - user
          - everyone
          translation_key: who_can
    snooze:
      example: user
      selector: *id016
    snooze_options: *id017
push:
  fields:
    message: *id003
    title: *id004
    severity: *id005
    icon: *id006
    image: *id007
    tts_message: *id018
    recipients: &id020
      example: '["person.anna"]'
      selector:
        object: {}
    audience:
      example: binary_sensor.heads_up_audience_at_home
      selector: *id019
    id: *id008
    tag: *id009
    timeout: *id010
    tap_action: *id014
    actions: *id015
popup:
  fields:
    message: *id003
    title: *id004
    severity: *id005
    icon: *id006
    image: *id007
    tts_message: *id018
    recipients: *id020
    audience:
      example: binary_sensor.heads_up_audience_at_home
      selector: *id019
    id: *id008
    tag: *id009
    timeout: *id010
    tap_action: *id014
    actions: *id015
speak:
  fields:
    message: *id003
    title: *id004
    severity: *id005
    icon: *id006
    tts_message: *id018
    recipients: *id020
    id: *id008
    tag: *id009
    timeout: *id010
    tap_action: *id014
