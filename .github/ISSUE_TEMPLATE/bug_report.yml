name: Bug report
description: Something does not work as documented
body:
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Heads Up version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Action call or card configuration
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs from custom_components.heads_up
      render: text
