name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/docs_check.py

  python-ha-2026-9:
    # Same tests against the minimum tested version, Home Assistant 2026.9.4 (HA_API_NOTES N-20).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.14 .venv-ha
      - run: >-
          uv pip install --python .venv-ha/bin/python
          pytest-homeassistant-custom-component==0.13.367
          home-assistant-frontend==20260826.7
      - run: .venv-ha/bin/python -m pytest

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run
