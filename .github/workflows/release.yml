name: Release asset

# Attaches heads_up.zip to a published GitHub release. hacs.json sets `zip_release`, so every
# release needs this asset; GitHub counts its downloads (assets[].download_count).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the zip to (for example v3.0.1)
        required: true

permissions: {}

jobs:
  asset:
    runs-on: ubuntu-latest
    # Uploading a release asset needs write access to the repository contents.
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build heads_up.zip
        run: scripts/build_release_zip.sh "${TAG#v}"
      - name: Upload to the release
        run: gh release upload "$TAG" dist/heads_up.zip --clobber --repo "$GITHUB_REPOSITORY"
