repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: docs-check
        name: docs-check
        entry: uv run python scripts/docs_check.py
        language: system
        pass_filenames: false
        files: \.md$
