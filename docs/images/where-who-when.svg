<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Heads Up orchestrates where, who and when</title>
  <desc id="d">An automation makes one call. Heads Up, centrally configured and customized, orchestrates where the message shows up, who gets it, and when it is delivered or escalated.</desc>
  <style>
    .canvas { fill: #f6f8fa; stroke: #d1d9e0; }
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .rule { stroke: #d1d9e0; }
    .link { stroke: #818b98; fill: none; stroke-width: 2; stroke-linecap: round; }
    .tip { fill: #818b98; }
    .title { fill: #1f2328; }
    .sub { fill: #59636e; }
    .item { fill: #1f2328; }
    .blue { --a: #0969da; }
    .green { --a: #1a7f37; }
    .amber { --a: #9a6700; }
    .tint { fill: var(--a); fill-opacity: 0.12; }
    .bar { fill: var(--a); }
    .dot { fill: var(--a); }
    .ico { stroke: var(--a); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .code { fill: #0d1117; stroke: #30363d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .k { fill: #79c0ff; }
    .v { fill: #e6edf3; }
    .s { fill: #a5d6ff; }
    .cap { fill: #8b949e; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #151b23; stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .rule { stroke: #30363d; }
      .link { stroke: #6e7681; }
      .tip { fill: #6e7681; }
      .title { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .item { fill: #e6edf3; }
      .blue { --a: #4493f8; }
      .green { --a: #3fb950; }
      .amber { --a: #d29922; }
      .tint { fill-opacity: 0.16; }
      .code { fill: #010409; stroke: #3d444d; }
    }
  </style>
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#218bff"/>
      <stop offset="1" stop-color="#0550ae"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0550ae" flood-opacity="0.28"/>
    </filter>
    <clipPath id="c1"><rect x="40" y="250" width="300" height="290" rx="14"/></clipPath>
    <clipPath id="c2"><rect x="370" y="250" width="300" height="290" rx="14"/></clipPath>
    <clipPath id="c3"><rect x="700" y="250" width="300" height="290" rx="14"/></clipPath>
  </defs>

  <rect class="canvas" x="0.5" y="0.5" width="1039" height="579" rx="20"/>

  <!-- The call -->
  <rect class="code" x="300" y="28" width="440" height="68" rx="12"/>
  <circle cx="320" cy="44" r="4" fill="#ff5f56"/>
  <circle cx="334" cy="44" r="4" fill="#ffbd2e"/>
  <circle cx="348" cy="44" r="4" fill="#27c93f"/>
  <text class="cap" x="520" y="48" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.4">Your automation makes one call</text>
  <text class="mono" x="320" y="70" font-size="13"><tspan class="k">action:</tspan> <tspan class="v">heads_up.notify</tspan></text>
  <text class="mono" x="320" y="88" font-size="13"><tspan class="k">message:</tspan> <tspan class="s">"Water on the kitchen floor"</tspan></text>

  <path class="link" d="M520 96 V124"/>
  <path class="tip" d="M514 120 L520 130 L526 120 Z"/>

  <!-- The hub -->
  <rect x="350" y="136" width="340" height="66" rx="33" fill="url(#hub)" filter="url(#lift)"/>
  <circle cx="387" cy="169" r="20" fill="#ffffff" fill-opacity="0.2"/>
  <g transform="translate(387 169)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7 5 C-5 3 -5 0 -5 -3 C-5 -8 5 -8 5 -3 C5 0 5 3 7 5 Z"/>
    <path d="M-2 8.5 C-1 10 1 10 2 8.5"/>
  </g>
  <text x="420" y="165" font-size="19" font-weight="700" fill="#ffffff">Heads Up orchestrates</text>
  <text x="420" y="185" font-size="13" fill="#ffffff" fill-opacity="0.85">Centrally configured and customized</text>

  <!-- Branches -->
  <path class="link" d="M520 202 C520 224 190 224 190 238"/>
  <path class="link" d="M520 202 V238"/>
  <path class="link" d="M520 202 C520 224 850 224 850 238"/>
  <path class="tip" d="M184 240 L190 250 L196 240 Z"/>
  <path class="tip" d="M514 240 L520 250 L526 240 Z"/>
  <path class="tip" d="M844 240 L850 250 L856 240 Z"/>

  <!-- Where -->
  <g class="blue">
    <rect class="card" x="40.5" y="250.5" width="299" height="289" rx="14"/>
    <g clip-path="url(#c1)"><rect class="bar" x="40" y="250" width="300" height="5"/></g>
    <circle class="tint" cx="82" cy="296" r="22"/>
    <g class="ico" transform="translate(82 296)">
      <path d="M0 11 C-8 4 -9 0 -9 -3 C-9 -8 -5 -11 0 -11 C5 -11 9 -8 9 -3 C9 0 8 4 0 11 Z"/>
      <circle cx="0" cy="-3" r="3"/>
    </g>
    <text class="title" x="116" y="293" font-size="22" font-weight="700">Where</text>
    <text class="sub" x="116" y="314" font-size="13">Where it shows up</text>
    <path class="rule" d="M60 340 H320"/>
    <circle class="dot" cx="68" cy="369" r="4"/><text class="item" x="86" y="374" font-size="15">Banner on your dashboards</text>
    <circle class="dot" cx="68" cy="397" r="4"/><text class="item" x="86" y="402" font-size="15">Push to phones</text>
    <circle class="dot" cx="68" cy="425" r="4"/><text class="item" x="86" y="430" font-size="15">Popup on any open page</text>
    <circle class="dot" cx="68" cy="453" r="4"/><text class="item" x="86" y="458" font-size="15">Speech on speakers</text>
    <circle class="dot" cx="68" cy="481" r="4"/><text class="item" x="86" y="486" font-size="15">Mail</text>
    <circle class="dot" cx="68" cy="509" r="4"/><text class="item" x="86" y="514" font-size="15">Persistent Notification</text>
  </g>

  <!-- Who -->
  <g class="green">
    <rect class="card" x="370.5" y="250.5" width="299" height="289" rx="14"/>
    <g clip-path="url(#c2)"><rect class="bar" x="370" y="250" width="300" height="5"/></g>
    <circle class="tint" cx="412" cy="296" r="22"/>
    <g class="ico" transform="translate(412 296)">
      <circle cx="0" cy="-5" r="5"/>
      <path d="M-9 11 C-9 3 9 3 9 11"/>
    </g>
    <text class="title" x="446" y="293" font-size="22" font-weight="700">Who</text>
    <text class="sub" x="446" y="314" font-size="13">Who gets it</text>
    <path class="rule" d="M390 340 H650"/>
    <circle class="dot" cx="398" cy="369" r="4"/><text class="item" x="416" y="374" font-size="15">Everyone</text>
    <circle class="dot" cx="398" cy="397" r="4"/><text class="item" x="416" y="402" font-size="15">Only the admins</text>
    <circle class="dot" cx="398" cy="425" r="4"/><text class="item" x="416" y="430" font-size="15">Whoever is at home</text>
    <circle class="dot" cx="398" cy="453" r="4"/><text class="item" x="416" y="458" font-size="15">The last one to leave</text>
    <circle class="dot" cx="398" cy="481" r="4"/><text class="item" x="416" y="486" font-size="15">One person</text>
  </g>

  <!-- When -->
  <g class="amber">
    <rect class="card" x="700.5" y="250.5" width="299" height="289" rx="14"/>
    <g clip-path="url(#c3)"><rect class="bar" x="700" y="250" width="300" height="5"/></g>
    <circle class="tint" cx="742" cy="296" r="22"/>
    <g class="ico" transform="translate(742 296)">
      <circle cx="0" cy="0" r="11"/>
      <path d="M0 -6 V0 L4.5 3"/>
    </g>
    <text class="title" x="776" y="293" font-size="22" font-weight="700">When</text>
    <text class="sub" x="776" y="314" font-size="13">Delivered or escalated</text>
    <path class="rule" d="M720 340 H980"/>
    <circle class="dot" cx="728" cy="369" r="4"/><text class="item" x="746" y="374" font-size="15">Quiet at night</text>
    <circle class="dot" cx="728" cy="397" r="4"/><text class="item" x="746" y="402" font-size="15">Repeat until acknowledged</text>
    <circle class="dot" cx="728" cy="425" r="4"/><text class="item" x="746" y="430" font-size="15">Escalate to more people</text>
    <circle class="dot" cx="728" cy="453" r="4"/><text class="item" x="746" y="458" font-size="15">One summary in the evening</text>
    <circle class="dot" cx="728" cy="481" r="4"/><text class="item" x="746" y="486" font-size="15">Send on arrival</text>
  </g>
</svg>
