# Dev-only Home Assistant config. No real devices: the hub end-to-end checks use the stub below.
homeassistant:
  name: Heads Up Dev
  unit_system: metric
  time_zone: UTC

default_config:

# Dev-only stub notify services and fake media players that record every call (dev/stub_components).
hub_stub:

# Automations and scripts for trying the documented examples. The files are gitignored;
# `make dev-up` creates them empty when missing.
automation: !include automations.yaml
script: !include scripts.yaml

logger:
  default: info
  logs:
    custom_components.heads_up: debug

# Test entities for banner conditions
input_boolean:
  test_window:
    name: Test window open
  test_leak:
    name: Test water leak

input_select:
  test_mode:
    name: Test mode
    options: [home, away, night]
